name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - name: Build mod
        run: |
          f=$(find . -name build.gradle -not -path './.git/*' | head -1)
          if [ -z "$f" ]; then echo "build.gradle is missing from the repo"; exit 1; fi
          cd "$(dirname "$f")"
          gradle build
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp build/libs/*.jar "$GITHUB_WORKSPACE/out/"
      - uses: actions/upload-artifact@v4
        with:
          name: pnl-tracker-jar
          path: out/*.jar
